name: Weekly Catalog Update

on:
  schedule:
    # Run every Sunday at 00:00 UTC (before new season anime start airing)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch current season anime and update airing status
        run: node scripts/fetch-season.js
        env:
          NODE_ENV: production

      - name: Update filter options
        run: node scripts/update-filter-options.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/catalog.json.gz data/filter-options.json
          git diff --staged --quiet || git commit -m "Weekly catalog update: $(date -u '+%Y-%m-%d')

          Auto-generated by GitHub Actions weekly update workflow.

          Generated with [Devin](https://devin.ai)

          Co-Authored-By: Devin <158243242+devin-ai-integration[bot]@users.noreply.github.com>"
          git push

      - name: Upload catalog to Cloudflare KV
        run: node cloudflare-worker/upload-to-kv.js catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker to Cloudflare
        run: |
          cd cloudflare-worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
